name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c6
          path: .
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ace-watch-firmware
          path: |
            build/ace_watch.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
      - name: Publish release for Wi-Fi updates (only when version.txt changes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '[:space:]' < version.txt)
          if gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$VER already released"
            exit 0
          fi
          gh release create "v$VER" build/ace_watch.bin version.txt \
            --repo "${{ github.repository }}" \
            --title "Ace Watch v$VER" \
            --notes "Firmware v$VER. The watch installs this automatically over Wi-Fi."
